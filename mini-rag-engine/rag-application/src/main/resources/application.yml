server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: mini-rag-engine
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
management:
  endpoints:
    web:
      exposure:
        include: health,info

rag:
  chat:
    base-url: ${RAG_CHAT_BASE_URL:http://localhost:11434/v1}
    api-key: ${RAG_CHAT_API_KEY:ollama}
    model: ${RAG_CHAT_MODEL:llama2}
    timeout: ${RAG_CHAT_TIMEOUT:120s}
  embedding:
    base-url: ${RAG_EMBEDDING_BASE_URL:http://localhost:11434/v1}
    api-key: ${RAG_EMBEDDING_API_KEY:ollama}
    model: ${RAG_EMBEDDING_MODEL:embeddinggemma}
    timeout: ${RAG_EMBEDDING_TIMEOUT:120s}
  store:
    path: ${RAG_DATABASE_PATH:./data/rag.db}
  chunking:
    maximum-characters: ${RAG_CHUNK_MAX_CHARACTERS:2400}
    overlap-characters: ${RAG_CHUNK_OVERLAP_CHARACTERS:300}
  retrieval:
    top-k: ${RAG_TOP_K:5}
    minimum-score: ${RAG_MINIMUM_SCORE:0.25}
  embedding-batch-size: ${RAG_EMBEDDING_BATCH_SIZE:16}
